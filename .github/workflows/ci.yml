name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  ci:
    name: Neovim ${{ matrix.neovim.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - { name: '0.10', version: 'v0.10.4' }
          - { name: '0.12.4', version: 'v0.12.4' }
          - { name: stable, version: stable }
          - { name: nightly, version: nightly }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cendre reference snapshot
        run: test "$(git rev-parse HEAD:docs/reference/cendre)" = '009ea6d1287dcb83ada5ccf3b6934b959896d6c0'

      - name: Setup Neovim ${{ matrix.neovim.name }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim.version }}

      - name: Setup LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit-2.1

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Tools
        run: |
          luarocks install luacheck
          mkdir -p "$HOME/lua-language-server"
          curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$HOME/lua-language-server"
          echo "$HOME/lua-language-server/bin" >> "$GITHUB_PATH"
        env:
          LUALS_VERSION: "3.19.0"

      - name: Resolve Neovim Runtime
        run: echo "VIMRUNTIME=$(nvim --clean --headless --cmd 'lua io.write(vim.env.VIMRUNTIME)' --cmd 'quit')" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: make install

      - name: Format
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.1.0
          args: --color always --respect-ignores --check .

      - name: Run Checks
        run: make lint && make typecheck

      - name: Run Tests (including public-load smoke suite)
        run: make test

      - name: Verify help tags
        run: |
          nvim --headless --clean \
            -c 'set rtp^=.' \
            -c 'helptags doc' \
            -c 'help grisaille' \
            -c "lua assert(vim.fn.expand('%:t') == 'grisaille.txt')" \
            -c 'qa!'
